<!DOCTYPE html>
<html>
<head>
    <title>Jira Time Logger</title>
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .entry { margin-bottom: 10px; }
        input { padding: 5px; margin-right: 5px; }
        .delete-btn { 
            color: white; 
            background-color: #dc3545; 
            border: none; 
            padding: 6px 10px; 
            cursor: pointer; 
            border-radius: 3px;
        }
        .delete-btn:hover { background-color: #c82333; }
        #summary { margin: 15px 0; padding: 10px; background: #f8f9fa; display: inline-block; border-radius: 5px; }
        progress { width: 300px; height: 20px; margin-top: 5px; }
    </style>
</head>
<body>
    <h2>Log Time</h2>
	<!-- General Scratchpad (Sticky Note) -->
    <details style="margin-bottom: 20px; max-width: 522px;">
        <summary style="cursor: pointer; font-weight: bold; color: #856404; margin-bottom: 5px; user-select: none;">
            📝 General Scratchpad
        </summary>
        <textarea id="stickyNotes" placeholder="Current tickets, who is doing what, etc. (This never deletes automatically...)" 
        style="width: 100%; box-sizing: border-box; height: 100px; padding: 10px; background-color: #fff9c4; border: 1px solid #fbc02d; border-radius: 4px; font-family: sans-serif; resize: vertical; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); display: block;"></textarea>
    </details>
    <br>
    <label>Date: </label>
    <input type="date" id="dateInput"><br>

    <div id="summary">
        <strong id="totalTimeText">Total logged: 0m / 8h</strong><br>
        <!-- 480 minutes = 8 hours -->
        <progress id="timeProgress" max="480" value="0"></progress>
    </div>

    <div id="entries">
        <!-- Rows will be injected here -->
    </div>
	
	<textarea id="dailyNotes" placeholder="Daily notes (ignored by Jira script)..." rows="4" style="width: 100%; max-width: 500px; margin: 15px 0; padding: 10px; display: block; font-family: sans-serif;"></textarea>
    
    <button onclick="addEntry()">+ Add Ticket</button>
    <button onclick="submitData()">Submit</button>
    
    <!-- Added to show script logs -->
    <pre id="logOutput" style="margin-top: 20px; background: #333; color: #fff; padding: 10px; border-radius: 5px; display: none; max-height: 300px; overflow-y: auto;"></pre>
	
	<details id="historyAccordion" style="margin-top: 40px; padding-top: 20px; border-top: 2px solid #eee;">
        <summary style="cursor: pointer; font-weight: bold; font-size: 1.1em; color: #0052cc;">
            📂 View Previous Logs
        </summary>
        
        <div style="margin-top: 15px; margin-bottom: 15px;">
            <label>Search by Date: </label>
            <input type="date" id="searchHistoryDate" onchange="loadHistory()">
            <button onclick="document.getElementById('searchHistoryDate').value=''; loadHistory()">Clear</button>
            <small style="color: #666; margin-left: 10px;">(Leave empty to see last 10)</small>
        </div>
        
        <div id="historyResults">
            <!-- Logs will be injected here -->
        </div>
    </details>

    <script>
        // Load state from localStorage on startup
        window.onload = function() {
			const stickyBox = document.getElementById('stickyNotes');
			stickyBox.value = localStorage.getItem('jiraStickyNotes') || '';

				// Auto-save sticky notes on every single keystroke
			stickyBox.addEventListener('input', function() {
				localStorage.setItem('jiraStickyNotes', this.value);
			});
            const savedData = localStorage.getItem('jiraTimeState');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('dateInput').value = data.date || '';
                document.getElementById('dailyNotes').value = data.notes || ''; // Load notes
                document.getElementById('dateInput').value = data.date || '';
                if (data.entries && data.entries.length > 0) {
                    data.entries.forEach(e => addEntry(e.ticket, e.duration, e.desc));
                } else {
                    addEntry();
                }
            } else {
                addEntry();
            }
            // Auto-save and auto-calculate on any input change
            document.addEventListener('input', () => {
                saveState();
                calculateTotal();
            });
            calculateTotal(); // Calculate initial load
			
			document.getElementById('dateInput').valueAsDate = new Date();
        }

        function addEntry(ticket = '', duration = '', desc = '') {
            const div = document.createElement('div');
            div.className = 'entry';
            div.innerHTML = `
                <input type="text" placeholder="Ticket (e.g. SCRUM-42)" class="ticket" value="${ticket}">
                <input type="text" placeholder="Duration (e.g. 1h 30m)" class="duration" value="${duration}">
                <input type="text" placeholder="Description" class="desc" value="${desc}" size="40">
                <button class="delete-btn" onclick="removeEntry(this)">X</button>
            `;
            document.getElementById('entries').appendChild(div);
            saveState();
            calculateTotal();
        }

        function removeEntry(button) {
            button.parentElement.remove();
            saveState();
            calculateTotal();
        }

        function saveState() {
            const entries = Array.from(document.querySelectorAll('.entry')).map(row => ({
                ticket: row.querySelector('.ticket').value,
                duration: row.querySelector('.duration').value,
                desc: row.querySelector('.desc').value
            }));
            const notes = document.getElementById('dailyNotes').value; // Get notes
            const data = { date: document.getElementById('dateInput').value, entries, notes }; // Add to object
            localStorage.setItem('jiraTimeState', JSON.stringify(data));
        }

        function calculateTotal() {
            let totalMinutes = 0;
            const durationInputs = document.querySelectorAll('.duration');
            
            durationInputs.forEach(input => {
                const val = input.value.toLowerCase();
                let hours = 0;
                let minutes = 0;

                // Match numbers followed by 'h' or 'm'
                const hMatch = val.match(/(\d+)\s*h/);
                const mMatch = val.match(/(\d+)\s*m/);

                if (hMatch) hours = parseInt(hMatch[1], 10);
                if (mMatch) minutes = parseInt(mMatch[1], 10);

                totalMinutes += (hours * 60) + minutes;
            });

            // Update Progress Bar
            document.getElementById('timeProgress').value = totalMinutes;

            // Format text back to Xh Ym
            const displayHours = Math.floor(totalMinutes / 60);
            const displayMinutes = totalMinutes % 60;
            
            let timeString = "";
            if (displayHours > 0) timeString += `${displayHours}h `;
            if (displayMinutes > 0 || (displayHours === 0)) timeString += `${displayMinutes}m`;

            document.getElementById('totalTimeText').innerText = `Total logged: ${timeString.trim()} / 8h`;
        }

		async function submitData() {
            const date = document.getElementById('dateInput').value;
			const notes = document.getElementById('dailyNotes').value;
            const entries = Array.from(document.querySelectorAll('.entry'))
                .map(row => ({
                    ticket: row.querySelector('.ticket').value,
                    duration: row.querySelector('.duration').value,
                    desc: row.querySelector('.desc').value
                })).filter(e => e.ticket); 

            if (!date || entries.length === 0) {
                alert("Please select a date and enter at least one ticket.");
                return;
            }

            // Visual feedback while waiting for script to finish
            const submitBtn = document.querySelector('button[onclick="submitData()"]');
            submitBtn.innerText = "Submitting to Jira...";
            submitBtn.disabled = true;
            
            const logBox = document.getElementById('logOutput');
            logBox.style.display = 'none';
            logBox.innerText = "";

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ date, entries, notes }) // Send notes
                });

                const result = await response.json();

                // Show the script output in the pre block
                logBox.style.display = 'block';
                logBox.innerText = result.output || "No output returned.";

                if (response.ok && result.status === 'success') {
                    localStorage.removeItem('jiraTimeState');
                    document.getElementById('dateInput').value = '';
                    document.getElementById('entries').innerHTML = '';
					document.getElementById('dailyNotes').value = '';
                    addEntry(); 
                    calculateTotal();
                } else {
                    alert("There was a problem executing the script. Check logs below.");
                }
            } catch (err) {
                alert("Server error.");
            } finally {
                submitBtn.innerText = "Submit";
                submitBtn.disabled = false;
            }
        }
		
		document.getElementById('historyAccordion').addEventListener('toggle', function(e) {
            if (e.target.open) {
                loadHistory();
            }
        });

        async function loadHistory() {
            const searchDate = document.getElementById('searchHistoryDate').value;
            const resultsContainer = document.getElementById('historyResults');
            resultsContainer.innerHTML = '<i>Loading logs...</i>';

            try {
                const response = await fetch(`/history?date=${searchDate}`);
                const logs = await response.json();
                
                if (logs.length === 0) {
                    resultsContainer.innerHTML = '<p>No logs found.</p>';
                    return;
                }

                resultsContainer.innerHTML = '';
                logs.forEach((log, index) => {
                    // Using <details> to make each individual log collapsible
                    const logDetails = document.createElement('details');
                    
                    // Simple styling to make the log stand out
                    logDetails.style.background = '#f4f5f7';
                    logDetails.style.borderLeft = '4px solid #0052cc';
                    logDetails.style.padding = '10px 15px';
                    logDetails.style.marginBottom = '15px';
                    logDetails.style.borderRadius = '3px';

                    // If you searched for a specific date (only 1 result), open it by default
                    if (logs.length === 1) {
                        logDetails.open = true;
                    }

                    logDetails.innerHTML = `
                        <summary style="cursor: pointer; font-weight: bold; color: #333; outline: none; user-select: none;">
                            ${log.date}
                        </summary>
                        <pre style="margin: 15px 0 0 0; white-space: pre-wrap; font-family: monospace; color: #444; border-top: 1px solid #ddd; padding-top: 10px;">${log.content}</pre>
                    `;
                    resultsContainer.appendChild(logDetails);
                });
            } catch (err) {
                resultsContainer.innerHTML = '<p style="color: red;">Error loading history.</p>';
            }
        }
		</script>
</body>
</html>
